<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipper Inspector</title>
<style>
:root {
  --bg: #1a1917; --panel: #232120; --panel2: #2b2826; --line: #3a3633;
  --text: #ece9e4; --muted: #9a968f; --faint: #6b6862;
  --accent: #d81b78; --accent-soft: rgba(216,27,120,.16);
  --good: #2fb27a; --warn: #d9a441; --bad: #e5484d; --gold: #ffd700;
  --r: 14px; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 80px; }
h1 { font-size: 28px; letter-spacing: -.02em; margin: 0; }
h2 { font-size: 20px; letter-spacing: -.01em; margin: 56px 0 6px; display: flex; align-items: center; gap: 10px; }
h2 .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; }
.lead { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
header.top { padding: 36px 0 8px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.chip b { color: var(--text); font-weight: 600; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.grid { display: grid; gap: 14px; }

/* KPIs */
.kpis { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-top: 22px; }
.kpi { padding: 18px; }
.kpi .v { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.kpi .v small { font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.kpi .l { color: var(--muted); font-size: 13px; margin-top: 6px; }
.kpi .vs { margin-top: 10px; font-size: 13px; color: var(--muted); }
.kpi .vs b { color: var(--good); }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }

/* pipeline */
.pipe { grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative; }
.stage { padding: 16px; position: relative; }
.stage .k { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.stage .name { font-weight: 650; }
.stage .t { color: var(--accent); font-weight: 700; }
.stage .bar { height: 4px; border-radius: 4px; background: var(--panel2); margin: 10px 0 12px; overflow: hidden; }
.stage .bar i { display: block; height: 100%; background: var(--accent); }
.stage dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
.stage dt { color: var(--faint); } .stage dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.stage:not(:last-child)::after { content: "›"; position: absolute; right: -13px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 22px; z-index: 2; }
@media (max-width: 980px) { .pipe { grid-template-columns: 1fr 1fr; } .stage::after { display: none; } }
@media (max-width: 560px) { .pipe { grid-template-columns: 1fr; } }

/* timeline */
.tl { position: relative; user-select: none; }
.lane { position: relative; margin-bottom: 8px; border-radius: 8px; background: var(--panel2); overflow: hidden; }
.lane .lbl { position: absolute; left: 8px; top: 4px; font-size: 11px; color: var(--faint); z-index: 3; pointer-events: none; text-transform: uppercase; letter-spacing: .06em; }
.lane canvas { display: block; width: 100%; height: 76px; }
.lane.seg { height: 44px; } .lane.hl { height: 60px; }
.seg-b { position: absolute; top: 18px; height: 20px; border-radius: 4px; background: rgba(216,27,120,.5); border: 1px solid rgba(216,27,120,.8); }
.seg-b.alt { background: rgba(216,27,120,.3); }
.seg-loose { position: absolute; top: 18px; height: 20px; border: 1px dashed var(--faint); border-radius: 4px; }
.win { position: absolute; top: 18px; height: 36px; border-radius: 6px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 700; overflow: hidden; white-space: nowrap; }
.win.ok { background: rgba(47,178,122,.28); border: 1px solid var(--good); color: #bff3da; }
.win.no { background: repeating-linear-gradient(45deg, rgba(229,72,77,.22) 0 6px, rgba(229,72,77,.1) 6px 12px); border: 1px dashed var(--bad); color: #ffb4b6; }
.win.clipwin { background: var(--accent-soft); border: 1px solid var(--accent); color: #ffd0e6; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gold); z-index: 5; pointer-events: none; left: 0; box-shadow: 0 0 8px rgba(255,215,0,.6); }
.axis { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; margin-top: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }

.player-row { grid-template-columns: minmax(280px, 420px) 1fr; margin-top: 14px; align-items: start; }
@media (max-width: 820px) { .player-row { grid-template-columns: 1fr; } }
video { width: 100%; background: #000; border-radius: 10px; display: block; }
.tx { max-height: 330px; overflow-y: auto; padding: 4px 8px 4px 2px; scrollbar-width: thin; }
.tx p { margin: 0 0 10px; line-height: 1.75; }
.tx .st { color: var(--faint); font-size: 11px; margin-right: 8px; cursor: pointer; }
.w { cursor: pointer; border-radius: 4px; padding: 1px 1px; color: var(--muted); transition: background .08s; }
.w:hover { color: var(--text); }
.w.on { background: var(--gold); color: #1a1917; font-weight: 700; }
.w.past { color: var(--text); }

/* clips */
.clips { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.clip { padding: 16px; display: grid; gap: 12px; }
.clip .head { display: flex; gap: 10px; align-items: start; }
.rank { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; font-weight: 800; }
.clip h3 { margin: 0; font-size: 16px; line-height: 1.3; }
.clip .why { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.phone { max-width: 270px; margin: 0 auto; width: 100%; border: 6px solid #000; border-radius: 26px; overflow: hidden; background: #000; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
.phone video { border-radius: 0; aspect-ratio: 9 / 16; object-fit: cover; }
.mon { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 68px; }
.mon .cap { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.mon .line { font-size: 19px; font-weight: 800; min-height: 28px; }
.mon .line span { color: #fff; opacity: .55; } .mon .line span.sung { color: var(--gold); opacity: 1; }
.mini { position: relative; height: 22px; background: var(--panel2); border-radius: 6px; overflow: hidden; }
.mini i { position: absolute; top: 4px; bottom: 4px; background: rgba(216,27,120,.65); border-radius: 2px; }
.mini .playhead { top: 0; bottom: 0; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.tile b { display: block; font-size: 17px; } .tile span { font-size: 11px; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }

/* sync compare */
.cmp { display: grid; gap: 14px; }
.stack { display: flex; height: 38px; border-radius: 8px; overflow: hidden; background: var(--panel2); }
.stack div { display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #10120f; min-width: 0; overflow: hidden; }
.rowlbl { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
.b0 { background: #2fb27a; } .b1 { background: #8fcf6a; } .b2 { background: #e2c24a; } .b3 { background: #e8914a; } .b4 { background: #e5484d; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 11px; font-weight: 700; }
.tag.ok { background: rgba(47,178,122,.2); color: #8fe3bd; } .tag.no { background: rgba(229,72,77,.2); color: #ffb4b6; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 18px; margin-top: 14px; }
summary { cursor: pointer; font-weight: 600; }
details p, details li { color: var(--muted); font-size: 14px; }
.scroll-x { overflow-x: auto; }
footer { color: var(--faint); font-size: 12px; margin-top: 48px; }
button.seek { all: unset; cursor: pointer; color: var(--accent); }
button.seek:focus-visible, .w:focus-visible, video:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>window.DATA=/*__DATA__*/null;</script>
<script>
(() => {
const D = window.DATA;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const fmtMs = v => v == null ? "—" : v >= 1000 ? `${(v / 1000).toFixed(1)} s` : `${v} ms`;
const mb = b => `${(b / 1048576).toFixed(1)} MB`;
const dur = D.source.duration;
const pct = t => `${(t / dur * 100).toFixed(3)}%`;
const BIN_LABELS = ["< 100 ms", "100–250 ms", "250–500 ms", "0,5–1 s", "> 1 s"];

// ── agregados de sincronia ──
const sum = a => a.reduce((x, y) => x + y, 0);
const pooled = key => {
  const n = sum(D.clips.map(c => c.sync[key].n)) || 1;
  return [0, 1, 2, 3, 4].map(i => sum(D.clips.map(c => c.sync[key].bins[i] * c.sync[key].n)) / n);
};
const newBins = pooled("audio_new"), oldBins = pooled("audio_old");
const medianOf = key => { const v = D.clips.map(c => c.sync[key].median_ms).sort((a, b) => a - b); return v[Math.floor(v.length / 2)]; };
const frameAgree = sum(D.clips.map(c => c.sync.frame.agree_pct)) / D.clips.length;
const onsetMax = Math.max(...D.clips.map(c => c.sync.frame.onset_max_ms ?? 0));
const frameMs = D.clips[0]?.sync.frame.frame_ms ?? 40;

const totalSecs = sum(Object.values(D.stages).map(s => s.seconds));
const stageDefs = [
  ["audio", "Áudio", s => [["Formato", s.rate], ["Tamanho", mb(s.mp3_bytes)]]],
  ["transcription", "Transcrição", s => [["Modelo", s.model], ["Idioma", s.language], ["Segmentos", s.segments], ["Palavras c/ tempo", s.words], ...(s.glossary ? [["Glossário", s.glossary + " termos"]] : [])]],
  ["highlights", "Highlights", s => [["Modelo", s.model], ["Propostas", s.proposed], ["Aceitas", s.accepted]]],
  ["render", "Render 9:16", s => [["Cortes", s.clips], ["Saída", s.size], ["Layout", s.layout === "fit" ? "inteiro + fundo desfocado" : "corte central"]]],
];
const src = D.source;
const stageCards = [
  `<div class="panel stage"><div class="k"><span class="name">1 · Fonte</span><span class="t mono">—</span></div><div class="bar"><i style="width:0"></i></div>
   <dl><dt>Arquivo</dt><dd>${esc(src.name)}</dd><dt>Duração</dt><dd class="mono">${fmt(src.duration)}</dd><dt>Vídeo</dt><dd>${src.width}×${src.height} ${esc(src.codec)}</dd><dt>Tamanho</dt><dd>${mb(src.size)}</dd></dl></div>`,
  ...stageDefs.map(([k, name, rows], i) => {
    const s = D.stages[k];
    return `<div class="panel stage"><div class="k"><span class="name">${i + 2} · ${name}</span><span class="t mono">${s.seconds.toFixed(1)} s</span></div>
    <div class="bar"><i style="width:${Math.max(3, s.seconds / totalSecs * 100)}%"></i></div>
    <dl>${rows(s).map(([a, b]) => `<dt>${a}</dt><dd>${esc(b)}</dd>`).join("")}</dl></div>`;
  }),
];

const accepted = D.claude.accepted;
const rejected = D.claude.rejected;

// ── página ──
$("#app").innerHTML = `
<header class="top">
  <div><h1>Clipper · inspetor do pipeline</h1>
  <p class="lead" style="margin:6px 0 0">O que acontece entre o vídeo bruto e os cortes verticais legendados — com os números medidos, não prometidos.</p></div>
  <div class="chips"><span class="chip">Fonte <b>${esc(src.name)}</b></span><span class="chip">Idioma <b>${esc(D.lang)}</b></span><span class="chip">Gerado <b>${esc(D.generated)}</b></span></div>
</header>

<div class="grid kpis">
  <div class="panel kpi"><div class="v good">${Math.round(newBins[0])}<small>%</small></div>
    <div class="l">das legendas entram a menos de 100 ms da fala</div>
    <div class="vs">método antigo: <b style="color:var(--bad)">${Math.round(oldBins[0])}%</b> · mediana por corte ${D.clips.map(c => c.sync.audio_new.median_ms).join(" / ")} ms (antes ${D.clips.map(c => c.sync.audio_old.median_ms).join(" / ")} ms)</div></div>
  <div class="panel kpi"><div class="v ${frameAgree > 99 ? "good" : "warn"}">${frameAgree.toFixed(1)}<small>%</small></div>
    <div class="l">dos quadros do vídeo têm a legenda exatamente onde o plano manda</div>
    <div class="vs">pior entrada de legenda: <b>${onsetMax} ms</b> (1 quadro = ${frameMs} ms)</div></div>
  <div class="panel kpi"><div class="v">${D.clips.length}<small> cortes</small></div>
    <div class="l">${fmt(dur)} de vídeo → ${D.clips.map(c => Math.round(c.end - c.start) + " s").join(" + ")} em ${D.stages.render.seconds.toFixed(0)} s de render</div>
    <div class="vs">pipeline completo: <b>${totalSecs.toFixed(0)} s</b> (${(dur / totalSecs).toFixed(0)}× mais rápido que o tempo real)</div></div>
</div>

<h2><span class="n">1</span>Pipeline</h2>
<p class="lead">Cada etapa roda o código de produção de verdade (Whisper hospedado, Claude, ffmpeg). Tempos medidos nesta execução.</p>
<div class="grid pipe">${stageCards.join("")}</div>

<h2><span class="n">2</span>Linha do tempo e transcrição</h2>
<p class="lead">Forma de onda, segmentos transcritos e o que o Claude propôs. Clique em qualquer ponto — ou em qualquer palavra — para tocar a fonte naquele instante.</p>
<div class="panel">
  <div class="tl" id="tl">
    <div class="lane" id="laneWave"><span class="lbl">Áudio</span><canvas></canvas></div>
    <div class="lane seg"><span class="lbl">Fala (tracejado = onde o Whisper dizia que o segmento começava)</span>
      ${D.loose.map((l, i) => `<div class="seg-loose" style="left:${pct(l.start)};width:${pct(Math.max(l.end - l.start, .2))}"></div>`).join("")}
      ${D.segments.map((s, i) => `<div class="seg-b ${i % 2 ? "alt" : ""}" title="${esc(s.text)}" style="left:${pct(s.start)};width:${pct(Math.max(s.end - s.start, .2))}"></div>`).join("")}
    </div>
    <div class="lane hl"><span class="lbl">Claude: propostas</span>
      ${rejected.filter(r => r.start != null).map(r => `<div class="win no" title="${esc(r.title)} — ${esc(r.why)}" style="left:${pct(r.start)};width:${pct(Math.max(r.end - r.start, 1))}">✕ ${esc(r.why)}</div>`).join("")}
      ${accepted.map((h, i) => `<div class="win ok" title="${esc(h.title)}" style="left:${pct(h.start)};width:${pct(h.end - h.start)}">#${i + 1} ${esc(h.title)}</div>`).join("")}
    </div>
    <div class="playhead" id="ph"></div>
  </div>
  <div class="axis mono">${[0, .25, .5, .75, 1].map(f => `<span>${fmt(dur * f)}</span>`).join("")}</div>
  <div class="legend">
    <span><i style="background:rgba(216,27,120,.5)"></i>segmento (apertado até a 1ª e a última palavra)</span>
    <span><i style="border:1px dashed var(--faint)"></i>limite que o Whisper devolve por segmento</span>
    <span><i style="background:rgba(47,178,122,.4);border:1px solid var(--good)"></i>corte aceito</span>
    <span><i style="background:rgba(229,72,77,.3);border:1px dashed var(--bad)"></i>proposta recusada</span>
  </div>
  <div class="grid player-row">
    <div><video id="src" src="source.mp4" controls preload="metadata"></video>
      <p class="lead" style="margin:8px 0 0;font-size:13px">A palavra em <span class="w on" style="cursor:default">dourado</span> é a que o Whisper marcou como sendo falada agora.</p></div>
    <div class="tx" id="tx" tabindex="0" aria-label="Transcrição palavra a palavra"></div>
  </div>
</div>

<h2><span class="n">3</span>Os cortes</h2>
<p class="lead">Cada vídeo abaixo é o arquivo final, com a legenda queimada. O quadro “esperado” é desenhado a partir dos dados do plano — se os dois andam juntos, a sincronia está certa.</p>
<div class="grid clips" id="clips"></div>

<h2><span class="n">4</span>Sincronia: antes × depois</h2>
<p class="lead">Quando cada legenda entra, comparado com quando a palavra é falada no áudio do corte renderizado (re-transcrito de forma independente). Mesmo vídeo, mesma referência; só muda o método de tempo.</p>
<div class="panel cmp">
  ${[["Antes · tempo repartido por segmento", oldBins], ["Agora · tempo real de cada palavra", newBins]].map(([t, bins]) => `
  <div><div class="rowlbl"><span>${t}</span><span class="mono" style="color:var(--muted)">${Math.round(bins[0])}% a menos de 100 ms</span></div>
  <div class="stack">${bins.map((v, i) => `<div class="b${i}" style="width:${v}%" title="${BIN_LABELS[i]}: ${v.toFixed(1)}%">${v >= 7 ? Math.round(v) + "%" : ""}</div>`).join("")}</div></div>`).join("")}
  <div class="legend">${BIN_LABELS.map((l, i) => `<span><i class="b${i}"></i>erro ${l}</span>`).join("")}</div>
  <div class="scroll-x"><table>
    <thead><tr><th>Corte</th><th class="num">Mediana (agora)</th><th class="num">Mediana (antes)</th><th class="num">Quadros certos</th><th class="num">Pior entrada</th><th class="num">Legendas medidas</th><th>Maior divergência de áudio (agora)</th></tr></thead>
    <tbody>${D.clips.map(c => { const n = c.sync.audio_new, o = c.sync.audio_old, f = c.sync.frame, w = n.worst[0]; return `<tr>
      <td>#${c.rank}</td><td class="num good">${fmtMs(n.median_ms)}</td><td class="num bad">${fmtMs(o.median_ms)}</td>
      <td class="num">${f.agree_pct}%</td><td class="num">${fmtMs(f.onset_max_ms)}</td><td class="num">${n.n}${n.ambiguous || n.diverged ? ` <span title="${n.ambiguous} de frase repetida, ${n.diverged} de texto divergente: ficam de fora" style="color:var(--faint)">(+${n.ambiguous + n.diverged} fora)</span>` : ""}</td>
      <td>${w ? `“${esc(w.text)}” — entra ${fmtMs(Math.abs(w.err_ms))} ${w.err_ms > 0 ? "depois" : "antes"} (${w.ours}s vs ${w.heard}s)` : "—"}</td></tr>`; }).join("")}</tbody>
  </table></div>
</div>
<details><summary>Como isso é medido (e o que cada número não prova)</summary>
  <ul>
    <li><b>Quadros certos:</b> o corte é renderizado duas vezes, com e sem legenda. A diferença de pixels na faixa da legenda diz em quais quadros ela está na tela, e isso é comparado quadro a quadro com o plano. Mede o <i>render</i> (ffmpeg, ASS, deslocamento do corte), não a transcrição. Limiar calibrado: o ruído entre duas codificações tem p99 = 0,68 e a legenda real p1 = 2,74; usa-se 1,0.</li>
    <li><b>Erro de áudio:</b> o áudio do corte final é transcrito de novo pelo Whisper e comparado, palavra a palavra, com o instante em que cada legenda entra. É o que o espectador ouve contra o que lê. A referência também é o Whisper (±50–100 ms de imprecisão própria); em fala lenta, com pausas ou música, os dois podem discordar por mais de 1 s (veja a coluna de maior divergência).</li>
    <li><b>Fora das estatísticas:</b> frases que aparecem mais de uma vez no corte (alinhamento ambíguo) e pares com mais de 5 s de diferença (as duas transcrições discordam do <i>texto</i>, não do tempo). Aparecem contados, não escondidos.</li>
    <li><b>Não coberto aqui:</b> sincronia em outros idiomas e com música alta, e a qualidade do <i>texto</i> transcrito (erros como “Bryce” em vez de “Rice” acontecem).</li>
  </ul></details>

<h2><span class="n">5</span>O que o Claude propôs</h2>
<p class="lead">O modelo só <i>sugere</i> janelas; o código recusa o que não presta (fora do vídeo, curto ou longo demais, sobreposto) e ajusta as bordas aos limites de fala.</p>
<div class="panel scroll-x"><table>
  <thead><tr><th>Veredito</th><th>Janela proposta</th><th>Título</th><th>Por que (segundo o Claude)</th></tr></thead>
  <tbody>
  ${D.claude.raw.map(r => { const rej = rejected.find(x => x.start === r.start && x.end === r.end && x.title === r.title); return `<tr>
    <td>${rej ? `<span class="tag no">recusada</span><br><span style="color:var(--muted);font-size:12px">${esc(rej.why)}</span>` : `<span class="tag ok">aceita</span>`}</td>
    <td class="mono">${r.start != null ? `${fmt(r.start)}–${fmt(r.end)} (${Math.round(r.end - r.start)} s)` : "—"}</td><td>${esc(r.title)}</td><td style="color:var(--muted)">${esc(r.reason)}</td></tr>`; }).join("")}
  </tbody></table>
  <p style="color:var(--muted);font-size:13px;margin:12px 0 0">Regras: ${D.params.min_len}–${D.params.max_len} s por corte · sem sobreposição · bordas ajustadas ao início da 1ª palavra e ao fim da última.</p>
</div>
<footer>Gerado por <span class="mono">backend/scripts/clipper_report.py</span> · ${esc(D.generated)}</footer>
`;

// ── forma de onda ──
const wave = $("#laneWave canvas");
function drawWave() {
  const dpr = devicePixelRatio || 1, w = wave.clientWidth, h = wave.clientHeight;
  wave.width = w * dpr; wave.height = h * dpr;
  const g = wave.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  const bw = w / D.peaks.length;
  g.fillStyle = "rgba(236,233,228,.55)";
  D.peaks.forEach((p, i) => { const bh = Math.max(1.5, Math.sqrt(p) * (h - 8)); g.fillRect(i * bw, (h - bh) / 2, Math.max(bw - .6, .6), bh); });
  accepted.forEach(a => { g.fillStyle = "rgba(47,178,122,.18)"; g.fillRect(a.start / dur * w, 0, (a.end - a.start) / dur * w, h); });
}
drawWave(); new ResizeObserver(drawWave).observe(wave);

// ── transcrição palavra a palavra ──
const words = [];
const tx = $("#tx");
tx.innerHTML = D.segments.map(s => {
  const ws = s.words?.length ? s.words : s.text.split(/\s+/).map(t => ({ text: t, start: s.start, end: s.end }));
  return `<p><span class="st mono" data-t="${s.start}">${fmt(s.start)}</span>${ws.map(w => `<span class="w" tabindex="0" role="button" data-t="${w.start}" data-e="${w.end}">${esc(w.text)}</span>`).join(" ")}</p>`;
}).join("");
tx.querySelectorAll(".w").forEach(el => words.push({ el, s: +el.dataset.t, e: +el.dataset.e }));
const srcV = $("#src"), ph = $("#ph"), tl = $("#tl");
const seek = t => { srcV.currentTime = t; srcV.play().catch(() => {}); };
tx.addEventListener("click", e => { const t = e.target.closest("[data-t]"); if (t) seek(+t.dataset.t); });
tx.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { const t = e.target.closest("[data-t]"); if (t) { e.preventDefault(); seek(+t.dataset.t); } } });
tl.addEventListener("click", e => { const r = tl.getBoundingClientRect(); seek(Math.max(0, Math.min(dur, (e.clientX - r.left) / r.width * dur))); });

let cur = -1;
function tickSrc() {
  const t = srcV.currentTime;
  ph.style.left = pct(t);
  let lo = 0, hi = words.length - 1, idx = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (words[m].s <= t) { idx = m; lo = m + 1; } else hi = m - 1; }
  if (idx >= 0 && t > words[idx].e + .6) idx = -1; // silêncio
  if (idx !== cur) {
    if (cur >= 0) words[cur].el.classList.remove("on");
    if (idx >= 0) {
      words[idx].el.classList.add("on");
      if (!srcV.paused) { const el = words[idx].el; tx.scrollTop = el.offsetTop - tx.clientHeight / 2 + el.offsetHeight / 2 - tx.offsetTop; }
    }
    cur = idx;
  }
}
// ── cortes ──
const mkClip = c => {
  const f = c.sync.frame, a = c.sync.audio_new;
  return `<article class="panel clip" data-rank="${c.rank}">
    <div class="head"><span class="rank">${c.rank}</span><div><h3>${esc(c.title)}</h3><p class="why">${esc(c.reason)}</p></div></div>
    <div class="phone"><video src="${esc(c.file)}" poster="${esc(c.poster || "")}" controls preload="metadata" playsinline></video></div>
    <div class="mon" aria-live="off"><div class="cap">Esperado agora (dados do plano)</div><div class="line"></div></div>
    <div class="mini" title="Cada barra é uma legenda"><div class="mlane"></div><div class="playhead"></div></div>
    <div class="tiles">
      <div class="tile"><b class="${f.agree_pct > 99 ? "good" : "warn"}">${f.agree_pct}%</b><span>quadros certos</span></div>
      <div class="tile"><b>${fmtMs(f.onset_max_ms)}</b><span>pior entrada</span></div>
      <div class="tile"><b class="good">${fmtMs(a.median_ms)}</b><span>mediana vs áudio</span></div>
    </div>
    <div class="meta"><span class="mono">${fmt(c.start)}–${fmt(c.end)} da fonte</span><span>${Math.round(c.duration)} s</span><span>${c.w}×${c.h}</span><span>${mb(c.size)}</span><span>render ${c.render_s} s</span><span>${c.groups.length} legendas</span></div>
  </article>`;
};
$("#clips").innerHTML = D.clips.map(mkClip).join("");
const players = [];
document.querySelectorAll(".clip").forEach(card => {
  const c = D.clips[+card.dataset.rank - 1], v = $("video", card), line = $(".line", card), ph2 = $(".mini .playhead", card);
  $(".mlane", card).innerHTML = c.groups.map(g => `<i style="left:${g.t0 / c.duration * 100}%;width:${Math.max((g.t1 - g.t0) / c.duration * 100, .3)}%"></i>`).join("");
  let gi = -2, wi = -2;
  const tick = () => {
    const t = v.currentTime; ph2.style.left = `${t / c.duration * 100}%`;
    const g = c.groups.findIndex(x => t >= x.t0 && t < x.t1);
    let w = -1;
    if (g >= 0) c.groups[g].words.forEach((x, i) => { if (t >= x[1]) w = i; });
    if (g !== gi || w !== wi) {
      line.innerHTML = g < 0 ? '<span style="opacity:.25">—</span>' : c.groups[g].words.map((x, i) => `<span class="${i <= w ? "sung" : ""}">${esc(x[0])}</span>`).join(" ");
      gi = g; wi = w;
    }
  };
  players.push({ v, tick });
  v.addEventListener("play", () => { players.forEach(p => p.v !== v && p.v.pause()); srcV.pause(); });
  v.addEventListener("seeked", tick); v.addEventListener("timeupdate", tick); tick();
});
srcV.addEventListener("play", () => players.forEach(p => p.v.pause()));
srcV.addEventListener("seeked", tickSrc); srcV.addEventListener("timeupdate", tickSrc);
(function loop() { if (!srcV.paused) tickSrc(); players.forEach(p => { if (!p.v.paused) p.tick(); }); requestAnimationFrame(loop); })();
})();
</script>
</body>
